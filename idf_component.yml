# OTA Manager Component Manifest
version: "1.1.0"
description: "OTA Manager component for ESP-IDF."
maintainers:
  - "Aluizio Tomazelli <aluiziotomazelli@gmail.com>"

license: "MIT"

tags:
  - ota_manager
  - esp32
  - esp32s3
  - esp32c3
  - cpp

targets:
  - esp32
  - esp32s3
  - esp32c3
  - linux

dependencies:
  idf: ">=5.0"

files:
  use_gitignore: true
  exclude:
    - "host_test/**/*"
    - "test_apps/**/*"
    - ".clang-format"
    - ".gitignore"

examples:
  - path: "examples/scenarios/v1.0.0_base"
  - path: "examples/scenarios/v1.1.0_success"
  - path: "examples/scenarios/v1.2.0_failure"
  - path: "examples/scenarios/v1.3.0_security_failure"

url: "https://github.com/aluiziotomazelli/ota_manager"
repository: "https://github.com/aluiziotomazelli/ota_manager"